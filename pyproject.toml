[project]
name = "safe-cli-runner"
version = "0.0.1.dev0"
description = "Run Claude Code, Codex or Gemini CLI as a sandboxed, non-agentic LLM call from Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jiří Hermann", email = "hermann.jirka@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["anyio>=4.4"]
keywords = ["claude-code", "codex", "gemini-cli", "sandbox", "llm", "subprocess", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/UnityInFlow/safe-cli-runner"
Repository = "https://github.com/UnityInFlow/safe-cli-runner"
Issues = "https://github.com/UnityInFlow/safe-cli-runner/issues"
Changelog = "https://github.com/UnityInFlow/safe-cli-runner/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs", "/tests", "/.gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/safe_cli_runner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
